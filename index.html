<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具系统 - 实用在线工具集</title>
    <link rel="stylesheet" href="common/css/style.css">
    <link rel="stylesheet" href="common/css/utils.css">
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-light: #e8f0fe;
            --text-color: #1f2937;
            --text-secondary: #6b7280;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        /* 导航栏 */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Hero区域 */
        .hero {
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 50%, #93c5fd 100%);
            color: white;
            padding: 60px 24px;
            text-align: center;
        }

        .hero h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 16px;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 主内容区 */
        .content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        /* 工具分类网格 */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* 分类卡片 */
        .category-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .category-card:hover {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .category-icon {
            width: 40px;
            height: 40px;
            background: var(--primary-light);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .category-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-color);
        }

        /* 工具列表 */
        .tools-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tool-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .tool-link:hover {
            background: var(--primary-light);
        }

        .tool-link .icon {
            font-size: 16px;
        }

        .tool-link .name {
            font-size: 14px;
            color: var(--text-color);
            font-weight: 500;
        }

        /* 底部提示 */
        .footer-note {
            text-align: center;
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .hero h1 {
                font-size: 28px;
            }

            .content {
                padding: 32px 16px;
            }

            .categories-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">工具系统</a>
            <ul class="navbar-menu">
                <li><a href="#tools">工具</a></li>
                <li><a href="#about">关于</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero">
        <h1>在线工具集</h1>
        <p>简单实用的在线工具，无需下载，打开即用</p>
    </section>

    <div class="content" id="tools">
        <div class="categories-grid">
            <!-- 图片工具 -->

                <div class="category-header">
                    <div class="category-icon">🖼️</div>
                    <span class="category-title">图片工具</span>
                </div>
                <div class="tools-list">
                    <a href="image/compressor/index.html" class="tool-link">
                        <span class="icon">📦</span>
                        <span class="name">图片压缩</span>
                    </a>
                    <a href="image/convert/index.html" class="tool-link">
                        <span class="icon">🔄</span>
                        <span class="name">格式转换</span>
                    </a>
                    <a href="image/watermark/index.html" class="tool-link">
                        <span class="icon">💧</span>
                        <span class="name">图片水印</span>
                    </a>
                </div>
            </div>

            <!-- 视频工具 -->
            <div class="category-card">
                <div class="category-header">
                    <div class="category-icon">🎬</div>
                    <span class="category-title">视频工具</span>
                </div>
                <div class="tools-list">
                    <a href="video/cropping/index.html" class="tool-link">
                        <span class="icon">✂️</span>
                        <span class="name">视频裁剪</span>
                    </a>
                    <a href="video/watermark/index.html" class="tool-link">
                        <span class="icon">🎥</span>
                        <span class="name">视频水印</span>
                    </a>
                </div>
            </div>

            <!-- 数据工具 -->
            <div class="category-card">
                <div class="category-header">
                    <div class="category-icon">📋</div>
                    <span class="category-title">数据工具</span>
                </div>
                <div class="tools-list">
                    <a href="json/index.html" class="tool-link">
                        <span class="icon">{ }</span>
                        <span class="name">JSON 格式化</span>
                    </a>
                </div>
            </div>

            <!-- 开发工具 -->
            <div class="category-card">
                <div class="category-header">
                    <div class="category-icon">🔧</div>
                    <span class="category-title">开发工具</span>
                </div>
                <div class="tools-list">
                    <a href="pwd/index.html" class="tool-link">
                        <span class="icon">🔑</span>

                    </a>
                    <a href="uuid/index.html" class="tool-link">

                        <span class="name">UUID 生成</span>
                    </a>
                    <a href="diagrams/mermaid/index.html" class="tool-link">
                        <span class="icon">📊</span>
                        <span class="name">Mermaid 图表</span>
                    </a>
                </div>
            </div>

            <!-- 文档工具 -->
            <div class="category-card">
                <div class="category-header">
                    <div class="category-icon">📄</div>
                    <span class="category-title">文档工具</span>
                </div>
                <div class="tools-list">
                    <a href="docu/signature/index.html" class="tool-link">
                        <span class="icon">✍️</span>
                        <span class="name">签名工具</span>
                    </a>
                    <a href="docu/watermark/index.html" class="tool-link">
                        <span class="icon">🛡️</span>
                        <span class="name">文档水印</span>
                    </a>
                </div>
            </div>

            <!-- 下载工具 -->
            <div class="category-card">
                <div class="category-header">
                    <div class="category-icon">📥</div>
                    <span class="category-title">下载工具</span>
                </div>
                <div class="tools-list">
                    <a href="download/index.html" class="tool-link">
                        <span class="icon">⬇️</span>
                        <span class="name">多线程下载</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="footer-note" id="about">
            <p>纯前端运行 · 数据本地处理 · 保护隐私安全</p>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 工具系统</p>
        </div>
    </footer>

    <script src="common/js/utils.js"></script>
    <script src="common/js/nav.js"></script>
    <script>
        initNavbar();
    </script>
</body>
</html>
